[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-intelligence-plugin"
version = "0.1.0"
description = "Platform-neutral YouTube intelligence engine with a Hermes adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "youtube-transcript-api>=1.2,<2",
  "yt-dlp>=2026.8.0",
  "scrapetube>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=5.1,<6",
  "duckdb>=1.3,<2",
  "polars>=1.30,<2",
  "apscheduler>=3.11,<4",
  "python-dotenv>=1.0,<2",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["youtube_intelligence*", "hermes_plugin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
